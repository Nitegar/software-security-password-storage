{% extends "base.html" %}
{% block title %}Dashboard | Simple Login{% endblock %}
{% block content %}
<h1>You're signed in</h1>
<p class="muted">Welcome, {{ user.username }}. Your account is ready.</p>
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">Sign out</button>
</form>
{% endblock %}
